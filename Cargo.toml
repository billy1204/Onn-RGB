[package]
name = "onn-rgb"
version = "0.1.0"
edition = "2021"
description = "Linux lighting control for the onn 104-key LED Gaming Keyboard (USB 3938:1296)"
license = "MIT"
readme = "README.md"
keywords = ["keyboard", "led", "hid", "onn", "linux"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:winit"]

[dependencies]
# eframe defaults minus accesskit, which pulls in a large D-Bus dependency tree.
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Not used directly: keeps winit's default features (eframe's own `winit/default`
# can't be selected from here), such as loading libwayland at runtime.
winit = { version = "0.30", optional = true }

[[bin]]
name = "onn-rgb"
path = "src/bin/onn-rgb.rs"

[[bin]]
name = "onn-rgb-gui"
path = "src/bin/onn-rgb-gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
