[package]
name = "onn-rgb"
version = "0.1.0"
edition = "2021"
description = "Linux lighting control for the onn 104-key LED Gaming Keyboard (USB 3938:1296)"
license = "MIT"
readme = "README.md"
keywords = ["keyboard", "led", "hid", "onn", "linux"]

[features]
default = ["gui", "tray"]
gui = ["dep:eframe", "dep:winit"]
# System tray (StatusNotifierItem) for `onn-rgb daemon`.
tray = ["dep:ksni"]

[dependencies]
# eframe defaults minus accesskit, which pulls in a large D-Bus dependency tree.
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Not used directly: keeps winit's default features (eframe's own `winit/default`
# can't be selected from here), such as loading libwayland at runtime.
winit = { version = "0.30", optional = true }

# Pure-Rust D-Bus (zbus) with a small async-io runtime; no libdbus needed.
ksni = { version = "0.3", optional = true, default-features = false, features = ["blocking", "async-io"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[[bin]]
name = "onn-rgb"
path = "src/bin/onn-rgb.rs"

[[bin]]
name = "onn-rgb-gui"
path = "src/bin/onn-rgb-gui.rs"
required-features = ["gui"]

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
